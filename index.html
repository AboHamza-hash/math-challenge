<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>تحدي الرياضيات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Baloo+2:wght@600;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Math&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Concept: a night-sky arcade. Deep indigo world, four saturated unit colors taken from the textbook cover, white answer cards for legibility, a star mascot that grows accessories as you level up. Boldest moment: the full-screen burst after a correct answer. Single committed look (no light/dark switch). */
:root{
  --ink0:#160d3d;--ink1:#241466;--ink2:#3a1d8f;--card:#ffffff;--text:#1b1740;--mute:#6b6893;--line:#e4e1f5;
  --yellow:#ffd23f;--orange:#ff7a1a;--green:#1fb36b;--green-bg:#d9f8e6;--red:#e5484d;--red-bg:#ffe3e3;--cyan:#29c7ff;--pink:#ff4fa3;--violet:#8b5cf6;
  --fs:1;color-scheme:light;
  --f-ui:"Baloo 2","Aref Ruqaa",serif;--f-ar:"STIX Two Text","Aref Ruqaa",serif;--f-sol:"STIX Two Text","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 80% -10%,#5a2bc2 0,transparent 55%),radial-gradient(90% 70% at 0% 100%,#0f6fb8 0,transparent 55%),linear-gradient(180deg,var(--ink1),var(--ink0));background-color:var(--ink0);background-attachment:fixed;
  color:#fff;font-family:var(--f-ar);direction:rtl;font-size:calc(19px*var(--fs));line-height:1.7;min-height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:880px;margin:0 auto;padding-block:10px 90px;position:relative;z-index:2}
math{font-family:"Noto Sans Math","STIX Two Math","Latin Modern Math","Cambria Math","STIX Two Text",serif;font-size:1.12em}
mfrac>*{padding:.3em .12em}
.mw{unicode-bidi:isolate}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:12px}
.num{font-family:var(--f-ui);font-weight:800;font-variant-numeric:tabular-nums}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='190'><text x='150' y='100' font-size='24' font-family='Aref Ruqaa,serif' fill='white' text-anchor='middle' transform='rotate(-24 150 95)'>© أ. محمد إسماعيل</text></svg>")}
.sym{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sym i{position:absolute;font-style:normal;font-family:"STIX Two Text",serif;color:rgba(255,255,255,.07);animation:drift 18s linear infinite;top:0}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(180deg)}}

.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 28px;border-radius:18px;font-weight:700;font-size:1.05em;color:#2a1700;background:var(--yellow);box-shadow:0 6px 0 #c9951b,0 10px 22px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.gbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #c9951b}
.gbtn.green{background:#38d78a;box-shadow:0 6px 0 #178a52,0 10px 22px rgba(0,0,0,.28);color:#052d19}
.gbtn.green:active{box-shadow:0 1px 0 #178a52}
.gbtn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.gbtn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ibtn{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);box-shadow:0 4px 0 rgba(0,0,0,.25);display:inline-grid;place-items:center;font-weight:700;flex:none}
.ibtn svg{width:24px;height:24px}
.ibtn.off{opacity:.5}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}

.top{display:flex;align-items:center;gap:8px;padding-block:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 14px 3px 12px;font-weight:700;font-size:.9em;white-space:nowrap;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.pill svg{width:20px;height:20px}

.hero{position:relative;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-radius:28px;padding:20px 20px 22px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.28);margin-top:6px;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;right:-60px;top:-90px;background:conic-gradient(from 0deg,rgba(255,210,63,.35),transparent 20%,rgba(41,199,255,.3) 45%,transparent 65%,rgba(255,79,163,.3) 85%,rgba(255,210,63,.35));border-radius:50%;filter:blur(22px);animation:spin 16s linear infinite}
.hero>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{margin:0;font-size:1.9em;line-height:1.2;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero .sub{opacity:.9;font-size:.92em;margin:.3em 0 .7em}
.lvrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lvname{font-weight:700;color:var(--yellow);white-space:nowrap}
.xpb{flex:1;min-width:130px;height:20px;border-radius:99px;background:rgba(0,0,0,.35);padding:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.xpb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffe36e,#ff9d2e);box-shadow:0 0 14px rgba(255,200,60,.8);transition:width .8s cubic-bezier(.3,1.3,.5,1);position:relative;overflow:hidden;min-width:8px}
.xpb i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mascot{flex:none;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@media (max-width:540px){.hero{grid-template-columns:1fr;text-align:center}.hero .mascot{margin:0 auto}.lvrow,.stats{justify-content:center}}
.ringrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.tbar{flex:1;height:28px;border-radius:99px;background:rgba(0,0,0,.35);padding:4px;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#38d78a,#29c7ff);transition:width .8s;min-width:8px}
.tbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:.78em}

.sg{font-family:"STIX Two Math","Latin Modern Math","Cambria Math","STIX Two Text",serif;font-size:1.5em;line-height:.6;font-weight:400;display:inline-block;transform:translateY(.08em);padding:0 .08em}
.by{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:1.75em;color:var(--yellow);margin:.1em 0 .1em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.by span{color:#fff;opacity:.85;font-weight:400;font-size:.85em;margin-inline-end:.3em}
.credit{margin-top:34px;text-align:center;font-family:"Aref Ruqaa",serif;padding:14px 10px;border-radius:22px;background:linear-gradient(135deg,rgba(255,210,63,.2),rgba(255,79,163,.18));box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.credit span{display:block;font-size:.95em;opacity:.85}
.credit b{display:block;font-size:1.75em;line-height:1.5;color:var(--yellow);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.h2{display:flex;align-items:center;gap:10px;margin:28px 0 10px;font-size:1.35em;font-weight:700}
.h2 small{font-size:.65em;opacity:.7;font-weight:400}
.stickers{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity}
.stk{flex:none;width:112px;text-align:center;scroll-snap-align:start;background:rgba(255,255,255,.1);border-radius:20px;padding:12px 8px 10px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}
.stk svg{width:58px;height:58px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.stk b{display:block;font-size:.82em;margin-top:4px}
.stk small{display:block;font-size:.66em;opacity:.75;line-height:1.35}
.stk.off{opacity:.45}.stk.off svg{filter:grayscale(1) brightness(.8)}

.world{margin-top:18px;border-radius:28px;padding:16px 14px 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--w) 55%,#0b0630),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);position:relative;overflow:hidden}
.world>h2{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:1.3em;line-height:1.3;font-weight:700}
.wno{width:44px;height:44px;border-radius:14px;background:var(--w);display:grid;place-items:center;font-size:1.3em;box-shadow:0 4px 0 rgba(0,0,0,.28);flex:none}
.wp{font-size:.62em;opacity:.85;font-weight:400}
.path{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.node{position:relative;display:flex;align-items:center;gap:14px;width:min(100%,330px);transform:translateX(var(--o));text-align:right}
.node+.node{margin-top:30px}
.node+.node::before{content:"";position:absolute;top:-30px;right:calc(39px + var(--po));height:30px;border-right:5px dotted rgba(255,255,255,.35);transform:translateX(calc(var(--o)*-1 + var(--o)))}
.dot{position:relative;width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.25em;color:#fff;background:conic-gradient(#38d78a calc(var(--p)*1%),rgba(255,255,255,.18) 0);transition:transform .12s}
.dot::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--w);box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 5px 0 rgba(0,0,0,.3)}
.dot span{position:relative}
.node:hover .dot{transform:scale(1.06)}
.node:active .dot{transform:scale(.96)}
.node.cur .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}100%{box-shadow:0 0 0 20px rgba(255,255,255,0)}}
.ntxt{min-width:0}
.ntxt b{display:block;line-height:1.35;font-size:.95em}
.ntxt small{display:flex;gap:8px;align-items:center;opacity:.95;font-size:.75em}
.mstars{display:flex;gap:1px}
.go{position:absolute;top:-18px;right:4px;background:var(--yellow);color:#2a1700;border-radius:10px;padding:0 12px;font-size:.72em;font-weight:700;box-shadow:0 3px 0 #c9951b;animation:bob 1.6s infinite;z-index:2}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -14px;padding:8px 14px 12px;background:linear-gradient(180deg,var(--ink0) 72%,transparent)}
.hrow{display:flex;align-items:center;gap:8px}
.segs{flex:1;display:flex;gap:3px;height:22px;align-items:center;padding:0 2px}
.segs i{flex:1;min-width:3px;height:14px;border-radius:5px;background:rgba(255,255,255,.2);transition:background .3s,transform .3s}
.segs i.ok{background:linear-gradient(180deg,#5cf0a6,#1fb36b);box-shadow:0 0 8px rgba(56,215,138,.7)}
.segs i.bad{background:linear-gradient(180deg,#ff9a8f,#e5484d)}
.segs i.cur{background:var(--yellow);transform:scaleY(1.45);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.combo{display:flex;align-items:center;gap:4px;min-width:84px;justify-content:center;border-radius:14px;padding:2px 10px;background:rgba(255,255,255,.12);font-size:.95em;transition:all .2s;white-space:nowrap}
.combo svg{width:22px;height:22px;filter:grayscale(1) brightness(1.4);opacity:.7}
.combo.hot{background:linear-gradient(180deg,#ff9d2e,#ff4d1a);box-shadow:0 0 22px rgba(255,120,30,.8);animation:hotpop .35s}
.combo.hot svg{filter:none;opacity:1;animation:flick .5s infinite alternate}
@keyframes hotpop{50%{transform:scale(1.25)}}
@keyframes flick{to{transform:scale(1.15) rotate(-6deg)}}
.hrow2{display:flex;justify-content:space-between;font-size:.78em;opacity:.9;padding:4px 6px 0;gap:8px}
body.fire::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 70px 6px rgba(255,110,30,.55);animation:firepulse 1.2s infinite alternate}
@keyframes firepulse{to{box-shadow:inset 0 0 100px 14px rgba(255,150,40,.7)}}

.qc{position:relative;background:var(--card);color:var(--text);border-radius:26px;margin-top:8px;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.22),0 24px 50px rgba(0,0,0,.3);animation:cardin .4s cubic-bezier(.3,1.3,.5,1)}
.qc::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;border-radius:26px 26px 0 0;background:var(--w)}
@keyframes cardin{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 8px}
.qno{background:var(--w);color:#fff;border-radius:999px;padding:0 14px;font-weight:800;font-size:.8em;font-family:var(--f-ui)}
.hot-tag{background:linear-gradient(90deg,#ff9d2e,#ff4fa3);color:#fff;border-radius:999px;padding:0 12px;font-size:.74em;font-weight:700}
.pr{font-size:.8em;color:var(--mute)}
.qt{font-size:1.2em;line-height:2;margin:.1em 0 .5em}
.fig{display:grid;place-items:center;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px;margin:6px 0 14px}
.fig img{max-width:100%;max-height:300px;height:auto}
.tb{border-collapse:collapse;margin:8px auto;max-width:100%}
.tb th,.tb td{border:2px solid var(--line);padding:4px 14px;text-align:center}
.tb th{background:#f1eefc}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:62px;text-align:right;padding:8px 14px;border-radius:18px;background:#fff;color:var(--text);box-shadow:0 0 0 2.5px var(--line),0 6px 0 var(--line);font-size:1.1em;transition:transform .08s,box-shadow .08s,background .15s}
.opt .l{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--f-ui);font-size:1.05em;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.opt[data-a="a"] .l{background:var(--cyan)}.opt[data-a="b"] .l{background:var(--orange)}.opt[data-a="c"] .l{background:var(--pink)}.opt[data-a="d"] .l{background:var(--violet)}
.opt .v{flex:1;min-width:0}
.opt:hover:not(:disabled){box-shadow:0 0 0 2.5px var(--violet),0 6px 0 #c9bff3;transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 2.5px var(--violet),0 1px 0 #c9bff3}
.opt:disabled{cursor:default}
.opts.tf .opt{justify-content:center;font-weight:700;font-size:1.25em;min-height:70px}
.opt.ok{background:var(--green-bg);box-shadow:0 0 0 3px var(--green),0 6px 0 #178a52;animation:okpop .5s}
.opt.ok .l{background:var(--green)!important}
.opt.bad{background:var(--red-bg);box-shadow:0 0 0 3px var(--red),0 6px 0 #b83237;animation:shake .45s}
.opt.bad .l{background:var(--red)!important}
.opt.dim{opacity:.5}
@keyframes okpop{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{display:flex;align-items:center;gap:10px;margin-top:14px;border-radius:18px;padding:10px 16px;font-weight:700;font-size:1.1em;animation:pop .35s}
.fb.good{background:var(--green-bg);color:#0e6b3d;box-shadow:inset 0 0 0 2.5px var(--green)}
.fb.miss{background:var(--red-bg);color:#a2282c;box-shadow:inset 0 0 0 2.5px var(--red)}
.fb .xp{margin-inline-start:auto;font-family:var(--f-ui);font-weight:800;background:var(--yellow);color:#2a1700;border-radius:999px;padding:0 14px;box-shadow:0 3px 0 #c9951b}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.corr{margin-top:10px;font-weight:700;color:#0e6b3d}
.sol{margin-top:10px;background:var(--green-bg);color:#10301f;border-radius:18px;border-right:8px solid var(--green);padding:10px 16px 12px;font-family:var(--f-sol);font-size:1.02em;line-height:2.1;animation:slidein .4s}
.sol b{color:#0e6b3d;margin-inline-end:6px}
@keyframes slidein{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
details summary{cursor:pointer;color:var(--mute);margin-top:10px;font-size:.9em}
.nr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.nr small{color:var(--mute);font-size:.8em}

.mc{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:18;display:flex;align-items:flex-end;gap:6px;pointer-events:none;direction:ltr}
.mc .mascot{animation:none}
.mc .bub{background:#fff;color:var(--text);border-radius:16px 16px 16px 4px;padding:3px 12px;font-size:.78em;font-weight:700;margin-bottom:46px;max-width:44vw;opacity:0;transform:scale(.8);transition:all .25s;box-shadow:0 4px 0 rgba(0,0,0,.2);direction:rtl}
.mc .bub.on{opacity:1;transform:none}
.mc.hop .mascot{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.9)}}

.fl{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.fl .rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(from 0deg,var(--c) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);opacity:0;animation:rays 1.3s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.3)}25%{opacity:.85}100%{opacity:0;transform:rotate(50deg) scale(1)}}
.fl .w{position:relative;text-align:center;animation:wpop 1.25s cubic-bezier(.2,1.5,.4,1) forwards;opacity:0}
.fl .w b{display:block;font-size:min(20vw,104px);line-height:1.2;color:#fff;font-weight:700;text-shadow:0 4px 0 var(--d),0 8px 0 rgba(0,0,0,.3),0 0 40px var(--c)}
.fl .w small{display:inline-block;margin-top:6px;background:rgba(0,0,0,.5);padding:2px 18px;border-radius:99px;font-size:1.05em;max-width:88vw}
@keyframes wpop{0%{opacity:0;transform:scale(.2) rotate(-8deg)}18%{opacity:1;transform:scale(1.18) rotate(3deg)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.15) translateY(-30px)}}
.fl.big .w{animation-duration:2s}.fl.big .rays{animation-duration:2s}
.vig{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 62%);animation:vig .55s ease-out forwards}
@keyframes vig{from{opacity:1}to{opacity:0}}
.fx{position:fixed;z-index:41;pointer-events:none;font-family:var(--f-ui);font-weight:800;font-size:1.6em;color:var(--yellow);text-shadow:0 3px 0 rgba(0,0,0,.4);animation:fxup 1s ease-out forwards}
@keyframes fxup{from{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-12px) scale(1.2)}to{transform:translateY(-90px) scale(1);opacity:0}}
.quote{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:45;width:min(92vw,520px);background:linear-gradient(135deg,#fff,#f1eefc);color:var(--text);border-radius:22px;padding:12px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 0 rgba(0,0,0,.2),0 24px 60px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.3,1.4,.5,1);font-weight:700;direction:rtl}
.quote.on{transform:translate(-50%,0)}
.quote .mascot{animation:none}
.quote small{display:block;color:var(--violet);font-size:.7em}

/* ---------- helpers ---------- */
function ttl(s){return esc(s).replace(/∑/g,'<span class="sg">∑</span>')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lvl(){var l=0;for(var i=0;i<LEVELS.length;i++)if(S.xp>=LEVELS[i][0])l=i;var n=LEVELS[l+1];return {i:l,name:LEVELS[l][1],pct:n?(S.xp-LEVELS[l][0])/(n[0]-LEVELS[l][0]):1,next:n?n[0]:null}}
function flat(L){var a=[];L.groups.forEach(function(g){g.items.forEach(function(it,i){a.push({it:it,g:g,n:i+1,hot:g.hot})})});return a}
function lp(L){var f=flat(L),d=0;f.forEach(function(x){if(S.items[x.it.key])d++});return {t:f.length,d:d}}
function totals(){var t=0,d=0;DATA.forEach(function(L){var p=lp(L);t+=p.t;d+=p.d});return {t:t,d:d}}
function totalStars(){var s=0;for(var k in S.lessons)s+=S.lessons[k].stars||0;return s}
function award(id){if(S.badges[id])return;S.badges[id]=1;save();var b=BADGES.filter(function(x){return x[0]===id})[0];setTimeout(function(){toast(badgeSvg(b[3])+'<span>شارة جديدة: '+b[1]+'</span>');snd('star',2);burst(50,null,null,true)},900)}
function addXP(n){var before=lvl().i;S.xp+=n;save();var after=lvl().i;if(after>before&&P)P.levelUp=after}
function tools(close){return (close?'<button class="ibtn" id="back" aria-label="خروج">'+ico('x')+'</button>':'')+'<span style="flex:1"></span><button class="ibtn" id="fsb" aria-label="حجم الخط">أ+</button><button class="ibtn'+(S.sfx?'':' off')+'" id="snb" aria-label="المؤثرات">'+ico('sfx')+'</button>'}
function bind(){
  var b=document.getElementById('back');if(b)b.onclick=function(){snd('tap');home()};
  var f=document.getElementById('fsb');if(f)f.onclick=function(){S.fs=S.fs>=1.3?1:(S.fs>=1.15?1.3:1.15);document.documentElement.style.setProperty('--fs',S.fs);save();snd('tap')};
  var s=document.getElementById('snb');if(s)s.onclick=function(){S.sfx=!S.sfx;save();this.classList.toggle('off',!S.sfx);if(S.sfx)snd('tap')};
  var m=document.getElementById('msb');if(m)m.onclick=function(){S.music=!S.music;save();this.classList.toggle('off',!S.music);music(S.music);snd('tap')}}
function mcorner(){document.getElementById('mcw').innerHTML='<div class="mc" id="mc"><div class="bub" id="bub"></div>'+mascot('happy',lvl().i,78)+'</div>'}
function say(mood,txt){var w=document.getElementById('mc');if(!w)return;w.innerHTML='<div class="bub" id="bub"></div>'+mascot(mood,lvl().i,78);var b=document.getElementById('bub');
  if(txt){b.textContent=txt;setTimeout(function(){b.classList.add('on')},20);clearTimeout(say.t);say.t=setTimeout(function(){b.classList.remove('on')},2300)}
  w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop')}

/* ---------- home / map ---------- */

  document.body.classList.remove('fire');document.getElementById('mcw').innerHTML='';P=null;
  var t=totals(),lv=lvl(),pct=t.t?Math.round(t.d/t.t*100):0;
  var next=null;DATA.forEach(function(L){if(!next){var p=lp(L);if(p.d<p.t)next=L}});
  var h='<div class="top">'+tools(false)+'</div><div class="hero">'+mascot('happy',lv.i,132)+'<div><h1>تحدي الرياضيات</h1><div class="by"><span>إعداد</span> أ. محمد إسماعيل</div><div class="sub">الصف العاشر · '+t.t+' سؤالًا · اجمع النقاط وافتح الشارات وتعلّم الحل مع كل خطوة</div>'+
    '<div class="lvrow"><span class="lvname">المستوى '+(lv.i+1)+' · '+lv.name+'</span><div class="xpb"><i style="width:'+Math.round(lv.pct*100)+'%"></i></div><small class="num">'+S.xp+(lv.next?' / '+lv.next:'')+'</small></div>'+
    '<div class="stats"><span class="pill">'+flameSvg()+'<span class="num">'+S.days.n+'</span> يوم متتالٍ</span><span class="pill">'+starSvg(true,20)+'<span class="num">'+totalStars()+'</span> نجمة</span><span class="pill">أطول كومبو <span class="num">'+S.best+'</span></span></div>'+
    '<div class="ringrow"><div class="tbar"><i style="width:'+pct+'%"></i><b class="num">'+pct+'٪ من الرحلة</b></div></div>'+
    '<div style="margin-top:16px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center">'+(next?'<button class="gbtn" id="cont">'+(t.d?'أكمل المغامرة':'ابدأ المغامرة')+' ←</button>':'<b>أنهيت كل الأسئلة. أنت أسطورة!</b>')+' <button class="gbtn ghost" id="rst">ابدأ من الصفر</button></div></div></div>';
  h+='<div class="h2">الشارات <small class="num">'+Object.keys(S.badges).length+' / '+BADGES.length+'</small></div><div class="stickers">'+BADGES.map(function(b){return '<div class="stk'+(S.badges[b[0]]?'':' off')+'">'+badgeSvg(b[3])+'<b>'+b[1]+'</b><small>'+b[2]+'</small></div>'}).join('')+'</div>';
  var U={};DATA.forEach(function(L){(U[L.unit]=U[L.unit]||[]).push(L)});
  var off=[0,-24,-40,-24,0,10,16,10];
  Object.keys(U).forEach(function(u){var ls=U[u],done=0,tot=0;ls.forEach(function(L){var p=lp(L);done+=p.d;tot+=p.t});
    h+='<section class="world" style="--w:'+UC[u]+'"><h2><span class="wno num">'+u+'</span><span>'+UN[u][0]+'<br><span class="wp">'+UN[u][1]+' · <span class="num">'+done+'/'+tot+'</span></span></span></h2><div class="path">';
    ls.forEach(function(L,i){var p=lp(L),st=S.lessons[L.id]||{stars:0},o=off[i%8],po=off[(i+7)%8],cur=next&&next.id===L.id;
      h+='<button class="node'+(cur?' cur':'')+'" data-id="'+L.id+'" style="--o:'+o+'px;--po:'+(-(po-o)*0)+'px">'+(cur?'<span class="go">ابدأ</span>':'')+
        '<span class="dot" style="--p:'+(p.t?p.d/p.t*100:0)+'"><span class="num">'+L.id+'</span></span><span class="ntxt"><b>'+ttl(L.title)+'</b><small><span class="mstars">'+[1,2,3].map(function(k){return starSvg(st.stars>=k,18)}).join('')+'</span><span class="num">'+p.d+'/'+p.t+'</span></small></span></button>'});
    h+='</div></section>'});
  h+='<div class="credit"><span>إعداد</span><b>أ. محمد إسماعيل</b></div><p style="opacity:.7;font-size:.8em;margin-top:12px">© جميع الحقوق محفوظة لـ أ. محمد إسماعيل. تقدّمك محفوظ على هذا الجهاز. الأسئلة من بنك الأسئلة الموضوعية للصف العاشر، والحلول على طريقة الكتاب المدرسي.</p>';
  app.innerHTML=h;bind();window.scrollTo(0,0);
  document.getElementById('rst').onclick=resetAsk;
  var c=document.getElementById('cont');if(c)c.onclick=function(){ac();snd('whoosh');start(next.id)};
  Array.prototype.forEach.call(document.querySelectorAll('.node'),function(b){b.onclick=function(){ac();snd('whoosh');start(b.getAttribute('data-id'))}})}

function resetAsk(){snd('tap');var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox">'+mascot('sad',lvl().i,110)+'<h2>البدء من الصفر؟</h2><div style="opacity:.9">سيُمسح كل تقدمك: النقاط والنجوم والشارات والمستوى، ولا يمكن التراجع.</div><div class="acts" style="margin-top:18px"><button class="gbtn ghost" id="rno">إلغاء</button><button class="gbtn" id="ryes" style="background:#ff6b6b;box-shadow:0 6px 0 #b83237;color:#fff">نعم، ابدأ من الصفر</button></div></div>';
  document.body.appendChild(m);document.getElementById('rno').onclick=function(){m.remove();snd('tap')};
  document.getElementById('ryes').onclick=function(){var o=S;S=fresh();S.sfx=o.sfx;S.music=o.music;S.fs=o.fs;touchDay();save();m.remove();snd('whoosh');home()}}
/* ---------- play ---------- */
function start(id){
  var L=DATA.filter(function(x){return x.id===id})[0],f=flat(L),p=lp(L);
  if(p.d>=p.t){f.forEach(function(x){delete S.items[x.it.key]});save()}
  var i=0;while(i<f.length&&S.items[f[i].it.key])i++;
  var hist=f.map(function(x){var s=S.items[x.it.key];return s?(s==='bad'?'bad':'ok'):null});
  P={L:L,list:f,i:i,mode:'main',combo:0,gained:0,wrong:f.filter(function(x){return S.items[x.it.key]==='bad'}).map(function(x){return x.it.key}),miles:{},answered:false,fixList:null,fixHist:{},hist:hist,corrects:0,levelUp:null,pk:{}};
  question()}
function cnt(L){var tot={ok:0,bad:0,fixed:0,left:0},rows=[];L.groups.forEach(function(g,gi){var c={ok:0,bad:0,fixed:0,left:0};g.items.forEach(function(it){var s=S.items[it.key];if(s==='ok')c.ok++;else if(s==='bad')c.bad++;else if(s==='fixed')c.fixed++;else c.left++});for(var k in c)tot[k]+=c[k];rows.push({g:g,gi:gi,c:c})});return {tot:tot,rows:rows}}
function statsInner(L,hl){var r=cnt(L),t=r.tot,wr=t.bad+t.fixed;
  var h='<div class="sc"><div class="g"><b>'+t.ok+'</b>صحيحة</div><div class="r"><b>'+wr+'</b>خاطئة</div><div class="y"><b>'+t.left+'</b>متبقية</div></div><div class="scn">الحساب حسب إجابتك الأولى عن كل سؤال'+(t.fixed?' · صحّحت '+t.fixed+' منها في جولة التصحيح':'')+'</div><div class="gl">';
  r.rows.forEach(function(o){var c=o.c;h+='<div class="gr'+(hl===o.g?' hl':'')+'"><span>البند '+(o.gi+1)+' · '+(o.g.type==='tf'?'صح / خطأ':'اختيار من متعدد')+' <small style="opacity:.7">('+o.g.items.length+')</small></span><span class="n" style="color:#5cf0a3">✓ '+c.ok+'</span><span class="n" style="color:#ff8f93">✗ '+(c.bad+c.fixed)+'</span><span class="n" style="color:var(--yellow)">… '+c.left+'</span></div>'});
  return h+'</div>'}
function modal2(html,label){var m=document.createElement('div');m.className='modal';m.innerHTML='<div class="mbox wide">'+html+'<div style="margin-top:16px"><button class="gbtn" id="mok2">'+label+'</button></div></div>';document.body.appendChild(m);document.getElementById('mok2').onclick=function(){m.remove();snd('tap')}}
function showResult(hl){var L=P.L;snd('tap');modal2('<h2>نتيجتي</h2><div style="opacity:.85">الدرس '+esc(L.id)+' · '+ttl(L.title)+'</div>'+statsInner(L,hl),'متابعة')}
function corrTxt(x,it){return x.g.type==='tf'?(it.ans==='a'?'صحيحة':'خاطئة')+' ('+it.ans+')':'('+it.ans+')'}
function review(x,it,pk){
  P.answered=true;
  var solH='<div class="sol"><b>الحل :</b> '+it.sol+'</div>',note='<small>مراجعة فقط · لا تتغير النقاط</small>',nav='<div class="nr">'+note+'<button class="gbtn green" id="nx">التالي ←</button></div>';
  if(it.match){var rv=document.getElementById('reveal');if(rv)rv.parentNode.style.display='none';
    after('<div class="fb good"><span>مراجعة</span></div><div class="sol"><b>الإجابة :</b> <bdi dir="ltr">'+it.match+'</bdi><div style="margin-top:6px">'+it.sol+'</div></div>'+nav);return}
  var st=S.items[it.key],mine=pk&&pk.a,right=mine?mine===it.ans:(st==='ok'||st==='fixed');
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){var v=b.getAttribute('data-a');b.disabled=true;if(v===it.ans)b.classList.add('ok');else if(mine&&v===mine)b.classList.add('bad');else b.classList.add('dim')});
  var fb=right?'<div class="fb good"><span>'+(mine?'إجابتك صحيحة':'أجبت عن هذا السؤال بشكل صحيح سابقًا')+'</span><span class="rvtag">مراجعة</span></div><details open><summary>عرض الحل المختصر</summary>'+solH+'</details>'
    :'<div class="fb miss"><span>'+(mine?'اخترت ('+mine+') وهي غير صحيحة':'أخطأت في هذا السؤال سابقًا')+'</span><span class="rvtag">مراجعة</span></div><div class="corr">الإجابة الصحيحة: '+corrTxt(x,it)+'</div>'+solH;
  after(fb+nav)}
function curList(){return P.mode==='main'?P.list:P.fixList}
function hudHtml(){
  var l=curList(),n=l.length,segs='';
  for(var k=0;k<n;k++){var c=P.mode==='main'?P.hist[k]:(k<P.i?(P.fixHist[k]||'ok'):null);segs+='<i class="'+(c||'')+(k===P.i?' cur':'')+'"></i>'}
  return '<div class="hud"><div class="hrow"><button class="ibtn" id="back" aria-label="خروج">'+ico('x')+'</button><div class="segs" aria-label="التقدم">'+segs+'</div>'+
   '<div class="combo'+(P.combo>=3?' hot':'')+'" id="cmb">'+flameSvg()+'<span class="num">×'+P.combo+'</span></div></div>'+
   '<div class="hrow2"><span>'+(P.mode==='main'?'الدرس '+P.L.id+' · '+ttl(P.L.title):'جولة التصحيح')+'</span><span><span class="num">'+Math.min(P.i+1,n)+'/'+n+'</span> · <span class="num" id="xpv">'+S.xp+'</span> XP</span></div>'+
   '<div class="hrow3"><button class="gbtn cy" id="prv"'+(P.i<=0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>السؤال السابق</button><button class="gbtn pk" id="rsb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>نتيجتي</button></div></div>'}
function question(){
  var l=curList();if(P.i>=l.length){return P.mode==='main'?finish():finishFix()}
  var x=l[P.i],it=x.it;P.answered=false;document.body.classList.toggle('fire',P.combo>=5);
  var h=hudHtml()+'<div class="qc" style="--w:'+UC[P.L.unit]+'"><div class="qh"><span class="qno">'+esc(P.L.id)+' · '+x.n+'</span>'+(x.hot?'<span class="hot-tag">تفكير عليا · نقاط مضاعفة</span>':'')+
    '<span class="pr">'+(it.match?'اقرأ ثم اكشف الإجابة':(x.g.type==='tf'?'هل العبارة صحيحة أم خاطئة؟':'اختر الإجابة الصحيحة'))+'</span></div><div class="qt">'+it.q+'</div>'+(it.table||'')+(it.fig?'<div class="fig"><img src="'+it.fig+'" alt="شكل السؤال"></div>':'');
  if(it.match)h+='<div class="nr"><span></span><button class="gbtn" id="reveal">اكشف الإجابة</button></div>';
  else if(x.g.type==='tf')h+='<div class="opts tf"><button class="opt" data-a="a"><span class="l">a</span><span class="v">صحيحة</span></button><button class="opt" data-a="b"><span class="l">b</span><span class="v">خاطئة</span></button></div>';
  else h+='<div class="opts">'+it.c.map(function(c,i){var Lt='abcd'[i];return '<button class="opt" data-a="'+Lt+'"><span class="l">'+Lt+'</span><span class="v">'+c+'</span></button>'}).join('')+'</div>';
  h+='<div id="after"></div></div>';
  app.innerHTML=h;document.getElementById('back').onclick=function(){snd('tap');home()};
  mcorner();window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){answer(b.getAttribute('data-a'),b)}});
  var rv=document.getElementById('reveal');if(rv)rv.onclick=reveal;
  document.getElementById('prv').onclick=function(){if(P.i>0){snd('tap');P.i--;question()}};
  document.getElementById('rsb').onclick=function(){showResult()};
  var pk=P.pk[P.mode+P.i];if(pk||(P.mode==='main'&&S.items[it.key]))review(x,it,pk)}
function goNext(){snd('tap');P.i++;question()}
function after(html){document.getElementById('after').innerHTML=html;var n=document.getElementById('nx');
  var cx=curList()[P.i];if(n&&P.mode==='main'&&cx&&cx.n===cx.g.items.length){var gb=document.createElement('button');gb.className='gbtn ghost';gb.id='gres';gb.textContent='نتيجة هذا البند';n.parentNode.insertBefore(gb,n);gb.onclick=function(){showResult(cx.g)}}
  if(n){n.onclick=function(){if(P.levelUp!=null)afterLevel(goNext);else goNext()};setTimeout(function(){n.scrollIntoView({block:'nearest',behavior:'smooth'})},200)}}
function markHist(r){var s=document.querySelectorAll('.segs i')[P.i];if(!s)return;s.classList.remove('cur');s.classList.add(r);if(P.mode==='main')P.hist[P.i]=r;else P.fixHist[P.i]=r}
function afterLevel(cb){if(P&&P.levelUp!=null){var n=P.levelUp;P.levelUp=null;snd('level');burst(140,null,null,true);
  modal(mascot('cheer',n,150)+'<h2>مستوى جديد!</h2><div style="font-size:1.2em">وصلت إلى «'+LEVELS[n][1]+'»</div><div style="opacity:.85;font-size:.85em;margin-top:6px">'+(LVTXT[n]||'')+'</div>',cb)}else if(cb)cb()}
function milestone(){if(P.mode!=='main')return;var n=P.list.length,pct=(P.i+1)/n;if(pct>=.5&&!P.miles.h&&P.i+1<n){P.miles.h=1;addXP(10);P.gained+=10;setTimeout(function(){flash('نصف الدرس!','مكافأة +10 نقاط','#29c7ff','#0a6e96');snd('combo');burst(80,null,null,true);var e=document.getElementById('xpv');if(e)e.textContent=S.xp},1300)}}
function reveal(){
  if(P.answered)return;P.answered=true;var x=curList()[P.i],it=x.it;P.pk[P.mode+P.i]={r:1};
  if(!S.items[it.key])S.items[it.key]='ok';markHist('ok');addXP(10);P.gained+=10;P.corrects++;snd('ok',1);burst(40,null,null,true);flash('تمام!','فهمت الفكرة','#38d78a','#127a47');say('wow','فهمتها!');milestone();
  after('<div class="fb good">'+WORDS[Math.floor(Math.random()*WORDS.length)]+'<span class="xp">+10</span></div><div class="sol"><b>الإجابة :</b> <bdi dir="ltr">'+it.match+'</bdi><div style="margin-top:6px">'+it.sol+'</div></div><div class="nr"><span></span><button class="gbtn green" id="nx">التالي ←</button></div>');
  document.getElementById('reveal').style.display='none';var e=document.getElementById('xpv');if(e)e.textContent=S.xp}
function answer(a,btn){
  if(P.answered)return;P.answered=true;ac();
  var x=curList()[P.i],it=x.it,right=(a===it.ans),fix=P.mode==='fix';P.pk[P.mode+P.i]={a:a};
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){var v=b.getAttribute('data-a');b.disabled=true;if(v===it.ans)b.classList.add('ok');else if(v===a)b.classList.add('bad');else b.classList.add('dim')});
  var sol='<div class="sol"><b>الحل :</b> '+it.sol+'</div>';
  if(right){
    P.combo++;if(P.combo>S.best)S.best=P.combo;P.corrects++;
    var gain=(x.hot?20:10)+(P.combo>=3?5:0);if(fix)gain=5;var cm=COMBO[P.combo],w=WORDS[Math.floor(Math.random()*WORDS.length)];
    if(!S.items[it.key])S.items[it.key]='ok';else if(S.items[it.key]==='bad')S.items[it.key]='fixed';
    addXP(gain);P.gained+=gain;markHist('ok');
    snd('ok',P.combo);buzz(25);floatXP('+'+gain,btn);
    if(cm){flash(cm[0],cm[1],'#ff9d2e','#b34a00',true);snd('combo');burst(130,null,null,true)}
    else{flash(w,SUBS[Math.floor(Math.random()*SUBS.length)],'#38d78a','#127a47');burst(36,null,null,true)}
    say(cm?'cheer':'wow',cm?cm[0]:w);
    award('first');if(P.combo>=5)award('s5');if(P.combo>=10)award('s10');
    document.body.classList.toggle('fire',P.combo>=5);
    if(P.corrects%4===0)setTimeout(quote,1600);
    var cmb=document.getElementById('cmb');if(cmb){cmb.className='combo'+(P.combo>=3?' hot':'');cmb.innerHTML=flameSvg()+'<span class="num">×'+P.combo+'</span>'}
    after('<div class="fb good"><span>'+(cm?cm[0]:w)+'</span><span class="xp">+'+gain+'</span></div><details><summary>عرض الحل المختصر</summary>'+sol+'</details><div class="nr"><span></span><button class="gbtn green" id="nx">التالي ←</button></div>');
  }else{
    P.combo=0;snd('wrong');buzz([30,40,30]);markHist('bad');
    if(!S.items[it.key])S.items[it.key]='bad';if(P.wrong.indexOf(it.key)<0)P.wrong.push(it.key);save();
    document.body.classList.remove('fire');
    var c2=document.getElementById('cmb');if(c2){c2.className='combo';c2.innerHTML=flameSvg()+'<span class="num">×0</span>'}
    say('sad','ولا يهمك!');
    var corr=x.g.type==='tf'?(it.ans==='a'?'صحيحة':'خاطئة')+' ('+it.ans+')':'('+it.ans+')';
    after('<div class="fb miss"><span>'+MISS[Math.floor(Math.random()*MISS.length)]+'</span></div><div class="corr">الإجابة الصحيحة: '+corr+'</div>'+sol+'<div class="nr"><small>سنعيد هذا السؤال في جولة التصحيح</small><button class="gbtn" id="nx">فهمت، التالي ←</button></div>')}
  milestone();var e=document.getElementById('xpv');if(e)e.textContent=S.xp}
function finish(){
  var L=P.L,f=flat(L),ok=0;f.forEach(function(x){if(S.items[x.it.key]==='ok')ok++});
  var first=ok/f.length,stars=first>=.9?3:(first>=.7?2:1),ls=S.lessons[L.id]||{stars:0};ls.stars=Math.max(ls.stars,stars);S.lessons[L.id]=ls;
  var bonus=stars*10;addXP(bonus);P.gained+=bonus;save();
  if(ls.stars===3)award('star3');var t=totals();if(t.d>=t.t/2)award('half');if(t.d>=t.t)award('all');
  if(DATA.filter(function(x){return x.unit===L.unit}).every(function(x){var p=lp(x);return p.d>=p.t}))award('unit');
  document.body.classList.remove('fire');document.getElementById('mcw').innerHTML='';
  var idx=DATA.indexOf(L),nxt=DATA[idx+1],g=P.gained;
  var h='<div class="top">'+tools(true)+'</div><div class="res">'+mascot(stars===3?'cheer':'happy',lvl().i,130)+'<h2>'+(stars===3?'أداء أسطوري!':(stars===2?'عمل رائع!':'أنهيت الدرس!'))+'</h2><div style="opacity:.85">الدرس '+esc(L.id)+' · '+ttl(L.title)+'</div>'+
   '<div class="bst">'+[1,2,3].map(function(){return starSvg(true,84)}).join('')+'</div>'+
   '<div class="rs"><span class="pill">صحيح من أول مرة: <span class="num">'+ok+'/'+f.length+'</span></span><span class="pill">نقاط الجولة <span class="num" id="cnt">+0</span></span><span class="pill">أطول كومبو <span class="num">'+S.best+'</span></span></div>'+
   statsInner(L)+'<div class="acts" style="margin-top:18px">'+(P.wrong.length?'<button class="gbtn" id="fix">جولة التصحيح ('+P.wrong.length+')</button>':'')+(nxt?'<button class="gbtn '+(P.wrong.length?'ghost':'green')+'" id="nl">الدرس التالي ←</button>':'')+'<button class="gbtn ghost" id="hm">الخريطة</button></div></div>';
  app.innerHTML=h;bind();window.scrollTo(0,0);
  document.querySelectorAll('.bst svg').forEach(function(s,i){if(i<stars)setTimeout(function(){s.classList.add('on');snd('star',i);var r=s.getBoundingClientRect();burst(30,r.left+40,r.top+40,true)},500+i*450)});
  setTimeout(function(){snd('win');burst(170,null,null,true)},200);
  var cn=document.getElementById('cnt'),c0=0,iv=setInterval(function(){c0+=Math.max(1,Math.ceil(g/30));if(c0>=g){c0=g;clearInterval(iv)}cn.textContent='+'+c0},40);
  var a=document.getElementById('fix');if(a)a.onclick=startFix;var b=document.getElementById('nl');if(b)b.onclick=function(){snd('whoosh');start(nxt.id)};document.getElementById('hm').onclick=home;
  setTimeout(function(){afterLevel()},2200)}
function startFix(){var m={};P.list.forEach(function(x){m[x.it.key]=x});P.fixList=P.wrong.map(function(k){return m[k]}).filter(Boolean);P.mode='fix';P.i=0;P.combo=0;P.fixHist={};Object.keys(P.pk).forEach(function(k){if(k.indexOf('fix')===0)delete P.pk[k]});snd('whoosh');question()}
function finishFix(){
  var left=P.fixList.filter(function(x){return S.items[x.it.key]==='bad'});P.wrong=left.map(function(x){return x.it.key});var all=!left.length;if(all)award('fix');save();
  snd('win');burst(all?170:70,null,null,true);document.body.classList.remove('fire');document.getElementById('mcw').innerHTML='';
  app.innerHTML='<div class="top">'+tools(true)+'</div><div class="res">'+mascot(all?'cheer':'happy',lvl().i,130)+'<h2>'+(all?'صحّحت كل أخطائك!':'اقتربت من الإتقان')+'</h2><p style="opacity:.9">'+(all?'هذا ما يفعله المتفوقون: يراجعون الخطأ حتى يفهموه.':'بقي '+left.length+' سؤالًا يحتاج مراجعة أخرى.')+'</p><div class="acts">'+(all?'':'<button class="gbtn" id="fix">جولة أخرى ('+left.length+')</button>')+'<button class="gbtn '+(all?'green':'ghost')+'" id="hm">الخريطة</button></div></div>';
  bind();window.scrollTo(0,0);var a=document.getElementById('fix');if(a)a.onclick=startFix;document.getElementById('hm').onclick=home;setTimeout(function(){afterLevel()},800)}

['contextmenu','copy','cut','dragstart','selectstart'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()})});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if(k==='f12'||((e.ctrlKey||e.metaKey)&&['u','s','c','p','a'].indexOf(k)>-1)||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].indexOf(k)>-1))e.preventDefault()});
/* ---------- boot ---------- */
S=load();S.music=false;touchDay();document.documentElement.style.setProperty('--fs',S.fs||1);
(function(){var s=document.querySelector('.sym'),g=['π','∑','√','∠','x²','∞','Δ','θ','%','±','÷','∫'];for(var i=0;i<14;i++){var e=document.createElement('i');e.textContent=g[i%g.length];e.style.left=(Math.random()*95)+'%';e.style.animationDelay=(-Math.random()*18)+'s';e.style.animationDuration=(14+Math.random()*14)+'s';e.style.fontSize=(34+Math.random()*50)+'px';s.appendChild(e)}})();
fetch('data.json').then(function(r){return r.json()}).then(function(d){DATA=d;home()}).catch(function(){app.innerHTML='<div class="load">تعذّر تحميل الأسئلة. أعد تحميل الصفحة.</div>'});
})();
</script>
